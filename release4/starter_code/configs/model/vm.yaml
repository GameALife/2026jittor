__target__: VelocityModule
frame_knn: 16
num_train_points: 256
feat_embedding_dim: 256
decoder_hidden_dim: 64
dsm_sigma: 0.01
# full: predict clean-noisy (compatible with old checkpoints)
# residual: predict clean-mix (retrain required; better matches StraightPCF)
target_mode: full

# inference (used by predict_step / patch_based_denoise)
predict:
  outer_steps: 2
  inner_steps: 2
  patch_size: 1000
  seed_k: 8
  seed_k_alpha: 0.15
  fusion: weighted
  step_scale: 1.0
  seed_mode: fps_fast
  fps_candidates: 8192
