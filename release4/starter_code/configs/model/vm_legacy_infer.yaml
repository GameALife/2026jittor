# Optimized inference for existing (full-target) checkpoints.
__target__: VelocityModule
frame_knn: 16
num_train_points: 128
feat_embedding_dim: 256
decoder_hidden_dim: 64
dsm_sigma: 0.01
target_mode: full

predict:
  outer_steps: 2
  inner_steps: 2
  patch_size: 1000
  seed_k: 8
  seed_k_alpha: 0.15
  fusion: weighted
  step_scale: 1.0
  seed_mode: fps_fast
  fps_candidates: 8192
